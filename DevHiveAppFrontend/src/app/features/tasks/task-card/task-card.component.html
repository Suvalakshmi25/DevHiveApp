<article class="task-card">
  <div class="task-card-top">
    <span class="priority-tag" [class]="'priority-' + task().priority.toLowerCase()">
      <span class="priority-mark"></span>{{ task().priority }}
    </span>
    @if (canContribute()) { <button class="task-menu" type="button" [attr.aria-label]="'Edit ' + task().title" title="Edit task" (click)="editTask.emit(task())">✎</button> }
    @if (canAdminister()) { <button class="task-menu" type="button" [attr.aria-label]="'Delete ' + task().title" title="Delete task" (click)="deleteTask.emit(task())">×</button> }
  </div>
  <h4>{{ task().title }}</h4>
  @if (task().description) { <p class="task-description">{{ task().description }}</p> }
  <div class="task-card-footer">
    <span class="task-id">#{{ task().id }}</span>
    <app-styled-select
      class="status-dropdown assignment-dropdown"
      [id]="'task-assignee-' + task().id"
      [label]="'Assign ' + task().title"
      [options]="memberOptions()"
      [value]="task().assignedTo"
      [disabled]="!canContribute() || members().length === 0"
      (valueChange)="assign.emit({ task: task(), userId: $event })" />
    <app-styled-select
      class="status-dropdown"
      [id]="'task-status-' + task().id"
      [label]="'Change status for ' + task().title"
      [options]="statusOptions()"
      [value]="task().status"
      [disabled]="!canContribute()"
      (valueChange)="changeStatus.emit({ task: task(), status: $event })" />
  </div>
  <app-task-comments
    [taskId]="task().id"
    [comments]="comments()"
    [expanded]="commentsExpanded()"
    [canContribute]="canContribute()"
    [canAdminister]="canAdminister()"
    [currentRole]="currentRole()"
    [currentUserId]="currentUserId()"
    (toggle)="toggleComments.emit($event)"
    (edit)="editComment.emit($event)"
    (delete)="deleteComment.emit($event)"
    (add)="addComment.emit($event)" />
</article>
